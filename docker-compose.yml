services:
  postgres:
    image: postgres:16-alpine
    container_name: panther-postgres
    restart: unless-stopped
    command: postgres -c shared_buffers=256MB -c work_mem=8MB -c maintenance_work_mem=64MB -c effective_cache_size=512MB -c max_connections=150 -c random_page_cost=1.1 -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c min_wal_size=32MB -c max_wal_size=256MB
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-panther}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panther_secret}
      POSTGRES_DB: ${CONTROL_DB_NAME:-panther_control}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panther} -d ${CONTROL_DB_NAME:-panther_control}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - panther-net

  redis:
    image: redis:7-alpine
    container_name: panther-redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - panther-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: panther-backend:latest
    container_name: panther-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    env_file:
      - path: .env
        required: false
    environment:
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - POSTGRES_USER=${POSTGRES_USER:-panther}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-panther_secret}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - CONTROL_DB_NAME=${CONTROL_DB_NAME:-panther_control}
      - CONTROL_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-panther}:${POSTGRES_PASSWORD:-panther_secret}@postgres:5432/${CONTROL_DB_NAME:-panther_control}
      - CONTROL_DATABASE_SYNC_URL=postgresql://${POSTGRES_USER:-panther}:${POSTGRES_PASSWORD:-panther_secret}@postgres:5432/${CONTROL_DB_NAME:-panther_control}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-panther-tms-super-secret-key-change-in-production-min-32-chars}
      - BASE_DOMAIN=${BASE_DOMAIN:-panthertms.com}
      - GSP_BASE_URL=${GSP_BASE_URL:-https://gsp.adaequare.com}
      - GSP_CLIENT_ID=${GSP_CLIENT_ID:-}
      - GSP_CLIENT_SECRET=${GSP_CLIENT_SECRET:-}
      - FREIGHT_TIGER_BASE_URL=${FREIGHT_TIGER_BASE_URL:-https://api.freighttiger.com/api/tether}
      - FREIGHT_TIGER_AUTH_TOKEN=${FREIGHT_TIGER_AUTH_TOKEN:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_panther_tms}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-rzp_secret_panther_tms_secure}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-rzp_webhook_secret_panther_2026}
      - DEMO_TENANT_ID=${DEMO_TENANT_ID:-demo123456}
      - DEMO_COMPANY_CODE=${DEMO_COMPANY_CODE:-DEMOLOGISTICS}
      - DEMO_TENANT_NAME=${DEMO_TENANT_NAME:-Demo Logistics Pvt Ltd}
      - DEMO_ADMIN_EMAIL=${DEMO_ADMIN_EMAIL:-admin@demo.com}
      - DEMO_ADMIN_PASSWORD=${DEMO_ADMIN_PASSWORD:-PantherTMS@2026!}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - panther-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: panther-frontend:latest
    container_name: panther-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 192M
    env_file:
      - path: .env
        required: false
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      - NEXT_PUBLIC_ROOT_DOMAIN=${NEXT_PUBLIC_ROOT_DOMAIN:-localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      - backend
    networks:
      - panther-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: panther-pgadmin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@panthertms.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-panther_secret}
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_WTF_CSRF_CHECK_DEFAULT: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - panther-net

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  panther-net:
    driver: bridge
