version: '3.8'

services:
  ai-test-postgres:
    image: postgres:16-alpine
    container_name: panther-ai-test-postgres
    restart: "no"
    environment:
      POSTGRES_USER: ${AI_TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AI_TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AI_TEST_POSTGRES_DB}
    ports:
      # Strictly bind to 127.0.0.1 loopback only
      - "127.0.0.1:5434:5432"
    volumes:
      - panther_ai_test_postgres_data:/var/lib/postgresql/data
    networks:
      - panther-ai-test-net

  ai-test-redis:
    image: redis:7-alpine
    container_name: panther-ai-test-redis
    restart: "no"
    # Strictly use noeviction memory policy to ensure lock keys cannot be silently evicted
    command: redis-server --maxmemory 64mb --maxmemory-policy noeviction --save ""
    ports:
      # Strictly bind to 127.0.0.1 loopback only
      - "127.0.0.1:6380:6379"
    volumes:
      - panther_ai_test_redis_data:/data
    networks:
      - panther-ai-test-net

  ai-test-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: panther-ai-test-backend:latest
    container_name: panther-ai-test-backend
    restart: "no"
    environment:
      POSTGRES_USER: ${AI_TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AI_TEST_POSTGRES_PASSWORD}
      POSTGRES_HOST: panther-ai-test-postgres
      POSTGRES_PORT: 5432
      CONTROL_DB_NAME: panther_ai_control_test
      REDIS_HOST: panther-ai-test-redis
      REDIS_PORT: 6379
      SECRET_KEY: ${AI_TEST_SECRET_KEY}
      AI_ENABLE_LR_CREATION: "true"
      AI_ENABLE_JOB_CREATION: "true"
      AI_ENABLE_HC_CREATION: "true"
      ENVIRONMENT: "ai_staging"
    ports:
      # Strictly bind staging backend to 127.0.0.1:8001
      - "127.0.0.1:8001:8000"
    depends_on:
      - ai-test-postgres
      - ai-test-redis
    networks:
      - panther-ai-test-net

  ai-test-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.ai-test
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8001
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8001
    image: panther-ai-test-frontend:latest
    container_name: panther-ai-test-frontend
    restart: "no"
    ports:
      # Strictly bind staging frontend to 127.0.0.1:3002
      - "127.0.0.1:3002:3000"
    depends_on:
      - ai-test-backend
    networks:
      - panther-ai-test-net

volumes:
  panther_ai_test_postgres_data:
  panther_ai_test_redis_data:

networks:
  panther-ai-test-net:
    driver: bridge
